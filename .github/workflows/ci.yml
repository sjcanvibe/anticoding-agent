name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile bytecode & verify syntax
        run: python3 -m py_compile anticoding_agent.py

      - name: Run sandbox, dotenv, fallback parser, CLI, and checkpoint self-tests
        run: |
          python3 -B -c '
          import anticoding_agent as agent
          safe, _, _ = agent.is_safe_path("README.md")
          assert safe, "Relative workspace file should be permitted"
          unsafe, _, _ = agent.is_safe_path("../../etc/passwd")
          assert not unsafe, "Directory traversal must be blocked"
          cmd_ok, _ = agent.is_safe_command("ls -la")
          assert cmd_ok, "Benign command should be permitted"
          cmd_bad, _ = agent.is_safe_command("sudo rm -rf /")
          assert not cmd_bad, "Privileged destructive command must be blocked"
          cmd_bad2, _ = agent.is_safe_command("rm -r -f /")
          assert not cmd_bad2, "Multi-flag root deletion must be blocked"
          rmap = agent.generate_repo_map()
          assert "def run_agent" in rmap, "Repo map must extract top-level symbols"
          cleaned, tcs = agent.extract_fallback_tool_calls(" Thinking... <tool_call>{\"name\": \"list_dir\", \"arguments\": {\"path\": \".\"}}</tool_call>")
          assert len(tcs) == 1 and tcs[0]["function"]["name"] == "list_dir", "Fallback tool_call parser failed"
          cli_args = agent.parse_cli_args(["-p", "test prompt", "--model", "gpt-4.1", "--ask"])
          assert cli_args.prompt == "test prompt" and cli_args.model == "gpt-4.1" and cli_args.ask is True
          print("All self-tests passed!")
          '
