[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anticoding-agent"
version = "2.1.0"
description = "Zero-dependency AI pair-programmer for OpenAI-compatible APIs with SSE streaming, Git worktree isolation, and hybrid memory."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "AGPL-3.0-only"}
dependencies = []

[project.scripts]
anticoding = "anticoding_agent:run_agent"

[tool.setuptools]
py-modules = ["anticoding_agent"]
